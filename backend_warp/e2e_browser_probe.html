<!doctype html>
<html><head><meta charset="utf-8"><title>E2E browser probe</title></head>
<body>
<h3>E2E browser probe (real Chrome fetch + parse)</h3>
<pre id="out">running…</pre>
<script>
const PORT = 8791, TICKS = 150, N = 106765;
async function run(ver) {
  const rows = [];
  for (let i = 0; i < 8; i++) await fetch(`http://127.0.0.1:${PORT}/tick?v=${ver}`).then(r => r.arrayBuffer());
  let bytes = 0, sink = 0;
  const tStart = performance.now();
  for (let i = 0; i < TICKS; i++) {
    const t0 = performance.now();
    const a = await fetch(`http://127.0.0.1:${PORT}/tick?v=${ver}`).then(r => r.arrayBuffer());
    const t1 = performance.now();
    const u8 = new Uint8Array(a, ver === 1 ? N * 4 : 0, N);
    for (let j = 0; j < N; j += 11) sink += u8[j];
    bytes = a.byteLength;
    rows.push(t1 - t0);
  }
  const wall = performance.now() - tStart;
  rows.sort((a, b) => a - b);
  return {
    version: ver === 1 ? "full_state" : "compact_state", ticks: TICKS, bytes,
    e2e_ms_median: +rows[TICKS >> 1].toFixed(3),
    e2e_ms_p95: +rows[Math.floor(TICKS * 0.95)].toFixed(3),
    ticks_per_s: +(TICKS / (wall / 1000)).toFixed(1),
    sink
  };
}
(async () => {
  const v1 = await run(1), v2 = await run(2);
  document.getElementById("out").textContent =
    JSON.stringify({ v1_full: v1, v2_compact: v2, speedup: +(v1.e2e_ms_median / v2.e2e_ms_median).toFixed(2) }, null, 1);
})();
</script>
</body></html>
