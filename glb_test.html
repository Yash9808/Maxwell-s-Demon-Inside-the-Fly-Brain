<!DOCTYPE html>
<!-- STANDALONE TEST PAGE — does not touch fly_demon_3d.html.
     Loads the 4 candidate GLBs, normalizes scale to a common frame,
     overrides materials with neutral translucent surfaces, and lets you
     toggle each asset + wired lighting so we can judge suitability. -->
<html>
<head>
<meta charset="utf-8">
<title>GLB asset test — fly brain candidates</title>
<style>
  body { margin:0; background:#05070c; color:#cfd6e0; overflow:hidden;
         font-family:ui-monospace,Consolas,monospace; }
  #panel { position:fixed; top:10px; left:10px; z-index:5; background:#0b0e14e8;
           border:1px solid #2a3446; border-radius:6px; padding:10px 12px;
           width:300px; font-size:12px; }
  #panel h3 { margin:0 0 8px; font-size:13px; color:#fff; }
  .row { display:flex; gap:6px; margin:4px 0; align-items:center; }
  button { flex:1; background:#141a24; border:1px solid #2a3446; color:#cfd6e0;
           border-radius:4px; font:inherit; padding:4px 6px; cursor:pointer; }
  button.active { border-color:#4ea3ff; color:#fff; background:#12233a; }
  label { font-size:11px; color:#8a94a4; }
  #info { margin-top:8px; font-size:11px; line-height:1.5; color:#8a94a4;
          max-height:220px; overflow:auto; }
  #info b { color:#cfd6e0; }
  input[type=range]{ flex:1; }
</style>
</head>
<body>
<div id="panel">
  <h3>GLB asset test (read-only)</h3>
  <div class="row"><button id="bLarva">larva brain (axotactin)</button>
    <button id="bFiji">fiji brain STL</button></div>
  <div class="row"><button id="bB7c7">b7c7 (4.5k tri)</button>
    <button id="bCT">adult fly CT</button></div>
  <div class="row"><button id="bAll">show all (aligned)</button>
    <button id="bNone">hide all</button></div>
  <div class="row"><label>opacity</label><input type="range" id="op" min="0" max="100" value="28"><span id="opv">0.28</span></div>
  <div class="row"><label>spin</label><input type="range" id="spin" min="0" max="100" value="18"></div>
  <div id="info">loading…</div>
</div>
<script type="module">
import * as THREE from "./three.module.js";
import { GLTFLoader } from "./GLTFLoader.module.js";

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0.4, 2.6);
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2,3,4); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 0.5); rim.position.set(-3,1,-2); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const grid = new THREE.GridHelper(4, 20, 0x223044, 0x141c28); scene.add(grid);

const ASSETS = {
  bLarva: { file:"drosophila_larve_brain__axotactin_enhancer_axog.glb", label:"larva brain (axotactin)" },
  bFiji:  { file:"fiji_sample_-_fly_brain_stl-binary_-_tarea_9.glb",    label:"fiji brain STL" },
  bB7c7:  { file:"b7c7e51c-2912-4f77-bbdf-a440cfbb3527.glb",            label:"b7c7 (4.5k tri)" },
  bCT:    { file:"drosophila_-_adult_fruit_fly_-_ct_scan.glb",          label:"adult fly CT" },
};
const root = new THREE.Group(); scene.add(root);
const loaded = {};   // id -> {group, size, center, tris, mats}
const info = document.getElementById("info");
function log(t){ info.innerHTML = t; }

const loader = new GLTFLoader();
for (const [id, a] of Object.entries(ASSETS)){
  loader.load(a.file, (gltf) => {
    const src = gltf.scene;
    // measure native bbox
    const box = new THREE.Box3().setFromObject(src);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    // normalize: fit into 1.6-unit box, centered at origin
    const g = new THREE.Group();
    src.position.sub(center);
    const wrap = new THREE.Group();
    wrap.add(src);
    wrap.scale.setScalar(1.6 / maxDim);
    g.add(wrap);
    // material override: neutral translucent, double-sided, no emissive
    let tris = 0;
    const mats = new Set();
    g.traverse(o => {
      if (o.isMesh){
        const pos = o.geometry.getAttribute("position");
        tris += o.geometry.getIndex() ? o.geometry.getIndex().count/3 : pos.count/3;
        o.material = new THREE.MeshPhysicalMaterial({
          color: 0x9fb4cc, metalness: 0.0, roughness: 0.55,
          transparent: true, opacity: 0.28,
          side: THREE.DoubleSide, depthWrite: false,
        });
        o.userData.origMat = o.material;
        mats.add(o.material);
      }
    });
    g.visible = false;
    root.add(g);
    loaded[id] = { group:g, size, tris: Math.round(tris), mats:[...mats],
      aspect: (size.x/maxDim).toFixed(2)+":"+(size.y/maxDim).toFixed(2)+":1.00" };
    refreshInfo();
  }, undefined, err => { log("load FAIL " + a.label + ": " + err); });
}

const state = { shown: new Set() };
function setShown(id, on){
  if (!loaded[id]) return;
  loaded[id].group.visible = on;
  on ? state.shown.add(id) : state.shown.delete(id);
  document.getElementById(id).classList.toggle("active", on);
  refreshInfo();
}
function refreshInfo(){
  const rows = Object.entries(ASSETS).map(([id,a]) => {
    const L = loaded[id];
    if (!L) return `<b>${a.label}</b> — loading…`;
    return `<b>${a.label}</b> — ${L.tris.toLocaleString()} tris · native size ${L.size.x.toFixed(2)}×${L.size.y.toFixed(2)}×${L.size.z.toFixed(2)} · aspect ${L.aspect} · ${state.shown.has(id) ? "<b>shown</b>" : "hidden"}`;
  });
  log(rows.join("<br>"));
}
for (const id of Object.keys(ASSETS))
  document.getElementById(id).onclick = () => setShown(id, !state.shown.has(id));
document.getElementById("bAll").onclick = () => Object.keys(ASSETS).forEach(id => setShown(id, true));
document.getElementById("bNone").onclick = () => Object.keys(ASSETS).forEach(id => setShown(id, false));
const op = document.getElementById("op");
op.oninput = () => {
  document.getElementById("opv").textContent = (op.value/100).toFixed(2);
  for (const id in loaded) loaded[id].mats.forEach(m => m.opacity = op.value/100);
};
const spin = document.getElementById("spin");
let auto = 0.18;
spin.oninput = () => auto = spin.value/100;

let drag = null, yaw = 0, pitch = 0.25;
renderer.domElement.addEventListener("pointerdown", e => drag = {x:e.clientX, y:e.clientY});
addEventListener("pointermove", e => { if(!drag) return;
  yaw -= (e.clientX-drag.x)*0.005; pitch += (e.clientY-drag.y)*0.004;
  pitch = Math.max(-1.2, Math.min(1.2, pitch)); drag = {x:e.clientX, y:e.clientY}; });
addEventListener("pointerup", () => drag = null);
addEventListener("wheel", e => { camera.position.multiplyScalar(1 + e.deltaY*0.001); }, {passive:true});
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function frame(){
  requestAnimationFrame(frame);
  root.rotation.y += auto*0.016;
  const r = camera.position.length();
  camera.position.set(
    r*Math.cos(pitch)*Math.sin(yaw), r*Math.sin(pitch), r*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
